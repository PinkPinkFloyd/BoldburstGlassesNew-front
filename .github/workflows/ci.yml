name: Demo checks
on:
  push:
    branches: [github-pages-demo]
  pull_request:
    branches: [github-pages-demo]
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      NUXT_PUBLIC_DEMO_MODE: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
