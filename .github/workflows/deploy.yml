name: CI/CD Docker Deploy

on:
  push:
    branches:
      - main  # 只在 main 分支 push 时触发

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ 拉取代码
      - name: Checkout code
        uses: actions/checkout@v3

      # 2️⃣ 安装 Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      # 3️⃣ 安装依赖 & 构建项目
      - name: Install & Build
        run: |
          npm install
          npm run build

      # 4️⃣ 登录 Docker Hub
      - name: Docker Login
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 5️⃣ Build Docker 镜像并打 tag
      - name: Build Docker Image
        run: |
          docker build -t ${{ secrets.REGISTRY }}/boldburst-frontend:latest .

      # 6️⃣ Push 镜像到 Docker Hub
      - name: Push Docker Image
        run: |
          docker push ${{ secrets.REGISTRY }}/boldburst-frontend:latest

      # 7️⃣ SSH 到跳板机，然后到内网服务器部署
      - name: Deploy to Server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.BASTION_HOST }}          # 跳板机 IP
          username: ${{ secrets.BASTION_USER }}      # 跳板机用户名
          key: ${{ secrets.BASTION_SSH_KEY }}        # 跳板机 SSH 私钥
          script: |
            echo "Deploying on internal server..."
            ssh ${{ secrets.INTERNAL_USER }} << 'EOF'
              docker pull ${{ secrets.REGISTRY }}/boldburst-frontend:latest
              docker-compose -f /path/to/docker-compose.yml up -d
            EOF
