name: CI/CD Docker Deploy

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Remove pnpm
        run: npm uninstall -g pnpm || true
      # 1️⃣ 拉取代码
      - name: Checkout code
        uses: actions/checkout@v3

      # 2️⃣ 设置 Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      # 3️⃣ 安装依赖并构建
      - name: Install & Build
        run: |
          npm install
          npm run build

      # 4️⃣ 登录 Docker Hub
      - name: Docker Login
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 5️⃣ Build Docker 镜像并 push
      - name: Build & Push Docker Image
        run: |
          docker build -t ${{ secrets.REGISTRY }}/boldburst-frontend:latest .
          docker push ${{ secrets.REGISTRY }}/boldburst-frontend:latest

      # 6️⃣ SSH 到跳板机，同步 docker-compose.yml 并在内网服务器部署
      - name: Deploy to internal server via Bastion
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.BASTION_HOST }}      # 跳板机 IP
          username: ${{ secrets.BASTION_USER }}  # 跳板机用户名
          key: ${{ secrets.BASTION_SSH_KEY }}    # 跳板机私钥
          script: |
            echo "Syncing docker-compose.yml to internal server..."
            scp -o StrictHostKeyChecking=no ./docker-compose.yml inspay-admin:/srv/dockerWeb/boldburstGlassesNew-front/docker-compose.yml

            echo "Pulling latest Docker image and restarting container..."
            ssh inspay-admin "
              sudo docker pull ${{ secrets.REGISTRY }}/boldburst-frontend:latest
              sudo docker-compose -f /srv/dockerWeb/boldburstGlassesNew-front/docker-compose.yml up -d
            "
